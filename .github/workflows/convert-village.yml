name: Convert Medieval Village to GLB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-village.yml'

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository and download LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Locate village Blender file
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(find assets -type f \( -iname '*village*.blend' -o -iname '*medival*.blend' \) -print -quit)"
          if [ -z "$SOURCE" ]; then
            echo "No village .blend file found under assets/."
            echo "Upload the original file to assets/world/medieval_village/ and push it with Git LFS, then rerun this workflow."
            exit 1
          fi
          echo "path=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Using source: $SOURCE"
          ls -lh "$SOURCE"

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Export to GLB
        env:
          SOURCE_BLEND: ${{ steps.source.outputs.path }}
        run: |
          blender --background "$SOURCE_BLEND" --python-expr "import bpy; bpy.ops.file.pack_all(); bpy.ops.export_scene.gltf(filepath='MedievalVillage.glb', export_format='GLB', export_image_format='AUTO')"
          test -s MedievalVillage.glb
          ls -lh MedievalVillage.glb

      - name: Upload converted model
        uses: actions/upload-artifact@v4
        with:
          name: MedievalVillage-GLB
          path: MedievalVillage.glb
          if-no-files-found: error
