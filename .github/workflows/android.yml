name: NINJA Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot and export templates
        run: |
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"

      - name: Configure Android SDK for Godot
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_PATH"
          test -x "$SDK_PATH/platform-tools/adb"
          test -d "$JAVA_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "Android SDK: $SDK_PATH"
          echo "Java SDK: $JAVA_HOME"

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/NINJA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NINJA-Android
          path: build/NINJA.apk
          if-no-files-found: error
