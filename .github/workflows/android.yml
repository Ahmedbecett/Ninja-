name: NINJA Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Validate project
        run: godot --headless --path . --editor --quit
      - name: Export Android
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/NINJA.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NINJA-Android
          path: build/NINJA.apk
