name: NINJA Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and download Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare optional source assets
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full blender
          mkdir -p assets/imported/forestpack assets/imported/characters assets/imported/world

          is_real_asset() {
            local file="$1"
            test -s "$file" || return 1
            ! head -c 100 "$file" | grep -q "version https://git-lfs.github.com/spec/v1"
          }

          for name in mikasanew2 Anime2; do
            src="assets/characters/blender/${name}.blend"
            dst="assets/imported/characters/${name}.glb"
            if is_real_asset "$src"; then
              blender --background "$src" --python-expr \
                "import bpy; bpy.ops.export_scene.gltf(filepath='${dst}', export_format='GLB', export_animations=True)"
              test -s "$dst"
              echo "Exported character: $dst"
            else
              echo "Optional character source unavailable (missing/LFS pointer): $src"
            fi
          done

          # Convert the supplied Blender world and Alembic Fuji scene into
          # Godot-importable GLB assets. Missing source files are non-fatal;
          # the game keeps its procedural fallback until they are uploaded.
          world_source="assets/world/source/22.blend"
          if is_real_asset "$world_source"; then
            blender --background "$world_source" --python-expr               "import bpy; bpy.ops.export_scene.gltf(filepath='assets/imported/world/22.glb', export_format='GLB', export_apply=True, export_animations=False)"
            test -s assets/imported/world/22.glb
            echo "Exported primary world model."
          else
            echo "22.blend not uploaded as a real binary yet; using procedural world fallback."
          fi

          fuji_source="assets/world/source/japanfuji.abc"
          if is_real_asset "$fuji_source"; then
            blender --background --python-expr               "import bpy; bpy.ops.wm.alembic_import(filepath='assets/world/source/japanfuji.abc'); bpy.ops.export_scene.gltf(filepath='assets/imported/world/japanfuji.glb', export_format='GLB', export_apply=True, export_animations=False)"
            test -s assets/imported/world/japanfuji.glb
            echo "Converted Mount Fuji Alembic scene to GLB."
          else
            echo "japanfuji.abc not uploaded as a real binary yet; Fuji backdrop will be omitted."
          fi

          archive="assets/source_archives/ForestPack.7z"
          if is_real_asset "$archive"; then
            if 7z x -y "$archive" -oassets/imported/forestpack; then
              if find assets/imported/forestpack -type f -iname 'ForestPack.fbx' -print -quit | grep -q .; then
                echo "ForestPack archive extracted."
              else
                echo "ForestPack.fbx not found in archive; continuing with fallback world."
              fi
            else
              echo "ForestPack archive could not be extracted; continuing with fallback world."
            fi
          else
            echo "Optional ForestPack archive unavailable (missing/LFS pointer); using fallback world."
          fi

      - name: Verify required ground textures
        run: |
          set -euo pipefail
          for asset in \
            "assets/world/grass/textures/Dirt_Ground_basecolor.jpg" \
            "assets/world/grass/textures/Dirt_Ground_normal.jpg" \
            "assets/world/grass/textures/Dirt_Ground_roughness.jpg" \
            "assets/world/grass/textures/Dirt_Ground_ambientocclusion.jpg"; do
            test -s "$asset"
            if head -c 100 "$asset" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "Git LFS pointer was not replaced by the real texture: $asset"
              exit 1
            fi
            echo "Texture ready: $asset ($(du -h "$asset" | cut -f1))"
          done

      - name: Setup Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot and export templates
        run: |
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"

      - name: Configure Android SDK for Godot
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_PATH"
          test -x "$SDK_PATH/platform-tools/adb"
          test -d "$JAVA_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "Android SDK: $SDK_PATH"
          echo "Java SDK: $JAVA_HOME"

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/NINJA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NINJA-Android
          path: build/NINJA.apk
          if-no-files-found: error
