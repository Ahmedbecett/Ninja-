name: NINJA Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: ninja-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and download Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare 3D source assets and safe mobile fallbacks
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full blender python3-pil python3-numpy
          blender --background --python-expr "import numpy; print('Blender NumPy ready:', numpy.__version__)"
          mkdir -p assets/imported/world assets/imported/forestpack assets/imported/characters

          is_real_asset() {
            local file="$1"
            test -s "$file" || return 1
            ! head -c 100 "$file" | grep -q "version https://git-lfs.github.com/spec/v1"
          }

          for name in mikasanew2 Anime2; do
            src="assets/characters/blender/${name}.blend"
            dst="assets/imported/characters/${name}.glb"
            if is_real_asset "$src"; then
              blender --background "$src" --python-expr \
                "import bpy; bpy.ops.export_scene.gltf(filepath='${dst}', export_format='GLB', export_animations=True)"
              test -s "$dst"
              echo "Exported character: $dst"
            else
              echo "Optional character source unavailable (missing/LFS pointer): $src"
            fi
          done

          archive="assets/source_archives/ForestPack.7z"
          if is_real_asset "$archive"; then
            if 7z x -y "$archive" -oassets/imported/forestpack; then
              if find assets/imported/forestpack -type f -iname 'ForestPack.fbx' -print -quit | grep -q .; then
                echo "ForestPack archive extracted."
              else
                echo "ForestPack.fbx not found; the game will use its procedural forest."
              fi
            else
              echo "ForestPack archive could not be extracted; the game will use its procedural forest."
            fi
          else
            echo "Optional ForestPack archive unavailable; the game will use its procedural forest."
          fi

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, random

          root = Path("assets/world/grass/textures")
          for path in root.glob("*"):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if not raw.startswith(b"version https://git-lfs.github.com/spec/v1"):
                  continue
              seed = int(hashlib.sha256(path.name.encode()).hexdigest()[:8], 16)
              rng = random.Random(seed)
              w = h = 256
              pixels = []
              name = path.name.lower()
              for y in range(h):
                  for x in range(w):
                      n = rng.randint(-18, 18)
                      if "normal" in name:
                          rgb = (max(0,min(255,128+n)), max(0,min(255,128+n)), max(0,min(255,245+n//3)))
                      elif "roughness" in name or "ambientocclusion" in name or "metallic" in name:
                          base = 55 if "metallic" in name else (205 if "roughness" in name else 225)
                          v = max(0,min(255,base+n))
                          rgb = (v,v,v)
                      elif any(k in name for k in ("leaf","grass","dandelion","stem","branch","nettle","leave","redcurrant")):
                          rgb = (max(0,min(255,38+n)), max(0,min(255,95+n*2)), max(0,min(255,32+n)))
                      else:
                          rgb = (max(0,min(255,92+n)), max(0,min(255,75+n)), max(0,min(255,48+n)))
                      pixels.append(rgb)
              image = Image.new("RGB", (w,h))
              image.putdata(pixels)
              if path.suffix.lower() == ".png":
                  image.save(path, format="PNG", optimize=True)
              else:
                  image.save(path, format="JPEG", quality=88, optimize=True)
              print("Generated build fallback texture:", path)
          PY

          if ! is_real_asset "assets/world/grass/Grass.glb"; then
            rm -f assets/world/grass/Grass.glb
            echo "Removed invalid LFS pointer for Grass.glb from build workspace; procedural vegetation remains enabled."
          fi

      - name: Extract Unity environment package assets for Godot import
        run: |
          set -euo pipefail
          package="assets/source_archives/environment.unitypackage"
          if [ ! -s "$package" ] || head -c 100 "$package" | grep -q "version https://git-lfs.github.com/spec/v1"; then
            echo "Unity environment package is missing or is only an LFS pointer; skipping extraction."
            exit 0
          fi
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          import shutil

          package = Path("assets/source_archives/environment.unitypackage")
          output = Path("assets/imported/unity_environment")
          output.mkdir(parents=True, exist_ok=True)
          extracted = 0
          with tarfile.open(package, mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  if not member.isfile() or not member.name.endswith("/pathname"):
                      continue
                  path_file = archive.extractfile(member)
                  if path_file is None:
                      continue
                  relative = path_file.read().decode("utf-8", "replace").strip().replace("\\", "/")
                  payload_name = member.name[:-len("pathname")] + "asset"
                  payload = archive.extractfile(payload_name)
                  if payload is None or not relative or relative.startswith("/") or ".." in Path(relative).parts:
                      continue
                  destination = output / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open("wb") as target:
                      shutil.copyfileobj(payload, target)
                  extracted += 1
          print(f"Extracted {extracted} Unity package assets into {output}")
          print("Unity scene/prefab metadata is retained as source; Godot can import compatible FBX/OBJ and texture files.")
          PY

      - name: Upload prepared resources for Android build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninja-prepared-resources
          path: |
            assets/imported/**
            assets/world/grass/textures/**
          if-no-files-found: ignore
          retention-days: 2

  prepare-main-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and download Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Blender and export the main 3D world
        timeout-minutes: 25
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          mkdir -p assets/imported/world
          src="assets/world/source/22.blend"
          if test -s "$src" && ! head -c 100 "$src" | grep -q "version https://git-lfs.github.com/spec/v1"; then
            blender --background --threads 2 "$src" --python-expr "import bpy; bpy.ops.export_scene.gltf(filepath='assets/imported/world/world_22.glb', export_format='GLB', export_apply=True)"
            test -s assets/imported/world/world_22.glb
            echo "Main 3D world exported successfully."
          else
            echo "22.blend is unavailable as a real LFS asset; the game will use its procedural fallback."
          fi

      - name: Upload main world model
        if: success() && hashFiles('assets/imported/world/world_22.glb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ninja-main-world
          path: assets/imported/world/world_22.glb
          if-no-files-found: error
          retention-days: 2

  prepare-fuji:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and download Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Convert Mount Fuji Alembic source
        timeout-minutes: 20
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          mkdir -p assets/imported/world
          src="assets/world/source/japanfuji.abc"
          if test -s "$src" && ! head -c 100 "$src" | grep -q "version https://git-lfs.github.com/spec/v1"; then
            # Some Ubuntu Blender builds are compiled without the Alembic importer.
            # Detect that before invoking it, so an optional Fuji source cannot fail the APK build.
            blender --background --threads 2 --python-expr "
import bpy, os, sys
src = os.path.abspath('assets/world/source/japanfuji.abc')
dst = os.path.abspath('assets/imported/world/japanfuji.glb')
operator = getattr(getattr(bpy.ops, 'wm', None), 'alembic_import', None)
if operator is None or not operator.poll():
    print('Alembic importer is unavailable in this Blender build; keeping procedural Fuji fallback.')
else:
    try:
        result = operator(filepath=src)
        if 'FINISHED' not in result:
            raise RuntimeError('Alembic import did not finish')
        bpy.ops.export_scene.gltf(filepath=dst, export_format='GLB', export_apply=True)
        if not os.path.isfile(dst) or os.path.getsize(dst) == 0:
            raise RuntimeError('Fuji GLB export was empty')
        print('Mount Fuji model exported successfully.')
    except Exception as exc:
        print('Optional Fuji conversion failed; keeping procedural fallback:', repr(exc))
        if os.path.exists(dst):
            os.remove(dst)
"
          else
            echo "japanfuji.abc is unavailable as a real LFS asset; the procedural Fuji fallback remains active."
          fi

      - name: Upload Mount Fuji model
        if: success() && hashFiles('assets/imported/world/japanfuji.glb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ninja-fuji
          path: assets/imported/world/japanfuji.glb
          if-no-files-found: error
          retention-days: 2

  build:
    if: always()
    needs: [prepare-assets, prepare-main-world, prepare-fuji]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and download Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download prepared game resources when available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ninja-prepared-resources
          path: assets
          merge-multiple: true

      - name: Download converted main world when available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ninja-main-world
          path: assets/imported/world

      - name: Download converted Fuji model when available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ninja-fuji
          path: assets/imported/world

      - name: Remove invalid Grass GLB pointer in the build workspace
        run: |
          set -euo pipefail
          grass="assets/world/grass/Grass.glb"
          if [ -f "$grass" ] && head -c 100 "$grass" | grep -q "version https://git-lfs.github.com/spec/v1"; then
            rm -f "$grass"
            echo "Removed unresolved LFS pointer; procedural vegetation fallback will be used."
          fi

      - name: Generate safe build textures if source files are Git LFS pointers
        run: |
          set -euo pipefail
          python3 -m pip --version >/dev/null 2>&1 || true
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, random
          root = Path("assets/world/grass/textures")
          root.mkdir(parents=True, exist_ok=True)
          for path in root.glob("*"):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if not raw.startswith(b"version https://git-lfs.github.com/spec/v1"):
                  continue
              seed = int(hashlib.sha256(path.name.encode()).hexdigest()[:8], 16)
              rng = random.Random(seed)
              name = path.name.lower()
              pixels = []
              for _ in range(256 * 256):
                  n = rng.randint(-18, 18)
                  if "normal" in name:
                      rgb = (max(0,min(255,128+n)), max(0,min(255,128+n)), max(0,min(255,245+n//3)))
                  elif any(k in name for k in ("roughness","ambientocclusion","metallic")):
                      base = 55 if "metallic" in name else (205 if "roughness" in name else 225)
                      v = max(0,min(255,base+n)); rgb = (v,v,v)
                  elif any(k in name for k in ("leaf","grass","dandelion","stem","branch","nettle","leave","redcurrant")):
                      rgb = (max(0,min(255,38+n)), max(0,min(255,95+n*2)), max(0,min(255,32+n)))
                  else:
                      rgb = (max(0,min(255,92+n)), max(0,min(255,75+n)), max(0,min(255,48+n)))
                  pixels.append(rgb)
              image = Image.new("RGB", (256,256)); image.putdata(pixels)
              image.save(path, format="PNG" if path.suffix.lower()==".png" else "JPEG", optimize=True)
              print("Generated fallback texture:", path)
          PY

      - name: Verify ground textures
        run: |
          set -euo pipefail
          for asset in \
            "assets/world/grass/textures/Dirt_Ground_basecolor.jpg" \
            "assets/world/grass/textures/Dirt_Ground_normal.jpg" \
            "assets/world/grass/textures/Dirt_Ground_roughness.jpg" \
            "assets/world/grass/textures/Dirt_Ground_ambientocclusion.jpg"; do
            test -s "$asset"
            if head -c 100 "$asset" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "Texture is still an LFS pointer: $asset"
              exit 1
            fi
            echo "Texture ready: $asset ($(du -h "$asset" | cut -f1))"
          done

      - name: Setup Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot and export templates
        run: |
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"

      - name: Configure Android SDK for Godot
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_PATH"
          test -x "$SDK_PATH/platform-tools/adb"
          test -d "$JAVA_HOME"
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          # Godot needs a valid debug keystore for Android APK export.
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          # Keep export settings explicit and usable in a clean CI runner.
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # Also fill the preset-level debug signing fields; never require a
          # private release keystore to produce a development/test APK.
          sed -i \
            -e "s|^keystore/debug=\"\"|keystore/debug=\"$HOME/.android/debug.keystore\"|" \
            -e 's|^keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|' \
            -e 's|^keystore/debug_password=\"\"|keystore/debug_password=\"android\"|' \
            export_presets.cfg
          echo "Android SDK: $SDK_PATH"
          echo "Java SDK: $JAVA_HOME"
          echo "Debug keystore configured."

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/NINJA.apk
          test -s build/NINJA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NINJA-Android
          path: build/NINJA.apk
          if-no-files-found: error
